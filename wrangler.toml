# Cloudflare Pages project: static site (dist/) + Pages Functions (functions/) for /api/*
name = "velocemotor"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[vars]
SUPABASE_URL = "https://ezynivufmaeftqymvawu.supabase.co"
# TEMPORARY until velocemotor.com is live and verified in Resend:
# - SITE_URL points emails (logo, admin link) at the pages.dev address
# - MAIL_FROM uses Resend's test sender, which can only deliver to the Resend account owner
#   (velocemotor.com@gmail.com): admin alerts work, emails to customers are rejected.
# Switch back to https://velocemotor.com and "Veloce Motor <noreply@velocemotor.com>" after domain setup.
SITE_URL = "https://velocemotor.pages.dev"
MAIL_FROM = "Veloce Motor <onboarding@resend.dev>"
REPLY_TO = "velocemotor.com@gmail.com"
ADMIN_EMAIL = "velocemotor.com@gmail.com"

# Product images. Public reads go through the bucket's custom domain (PUBLIC_MEDIA_URL), not this Function.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "velocemotor-media"

# Secrets — set with `wrangler pages secret put <NAME>` (or in the dashboard), and in .dev.vars locally:
#   SUPABASE_SERVICE_ROLE_KEY   Supabase secret key (sb_secret_… or legacy service_role JWT)
#   TURNSTILE_SECRET            Cloudflare Turnstile secret key
#   RESEND_API_KEY              Resend API key (emails are skipped if unset)
#   PAGES_DEPLOY_HOOK           Cloudflare Pages deploy hook URL (Publish button)
